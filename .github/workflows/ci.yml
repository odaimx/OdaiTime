name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: odaitime
          POSTGRES_USER: odaitime
          POSTGRES_PASSWORD: odaitime
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U odaitime" --health-interval 5s
          --health-timeout 5s --health-retries 10
      cache:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://odaitime:odaitime@localhost:5432/odaitime
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - name: Validar Caddyfile
        run: >-
          docker run --rm -e DOMAIN=time.example.com
          -v "$PWD/frontend/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: docker compose build
