[project]
name = "odaitime-api"
version = "0.1.0"
description = "API de ODAITIME — control de asistencia (LFT/STPS México)"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
